sonar.projectKey=pocketnote
sonar.projectName=PocketNote
sonar.projectVersion=1.0

# กำหนดโฟลเดอร์หลักที่มี Source Code
sonar.sources=apps/web/src,apps/api/src
# กำหนดไฟล์ที่ไม่ต้องสนใจ (Exclusions) เช่นพวกไฟล์ Config หรือเทสต์ต่างๆ
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/guest.storage.ts

# กำหนดโฟลเดอร์สำหรับ Test (เพื่อให้มันมองเป็นส่วนของ Test)
sonar.tests=apps/web/src,apps/api/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# เส้นทางชี้ไปยังไฟล์ Coverage ที่เราสร้างขึ้น (สมมติว่าเป็น lcov)
sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info,apps/api/coverage/lcov.info

# การตั้งค่า Language
sonar.sourceEncoding=UTF-8
